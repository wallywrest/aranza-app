name: Aranza 2.0 - calidad

on:
  push:
    branches:
      - aranza-v1-105-development
  pull_request:
    branches:
      - aranza-v1-105-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    name: Full suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias de desarrollo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compilar todos los módulos Python
        run: python -m compileall -q .

      - name: Ejecutar suite completa
        run: python -m pytest -q
